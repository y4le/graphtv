<svg
  xmlns="http://www.w3.org/2000/svg"
  id="graphtv-card"
  viewBox="0 0 1618 1000"
  role="img"
  aria-labelledby="graphtv-card-title graphtv-card-description"
>
  <title id="graphtv-card-title">graphtv</title>
  <desc id="graphtv-card-description">
    The graphtv wordmark over Game of Thrones: every episode of the run
    scrolling past in one ink tone on a season axis, hairlines where TVmaze,
    TMDB and IMDb disagree, season trendlines under a dashed full-series
    trendline, and the detected series breakpoint selected: the run splits into
    two spot-colored regimes either side of a dashed marker at S08E01, where the
    median rating moves from 8.9 to 6.7 — a 2.2-point drop the app scores 86 out
    of 100. No episode is selected.
  </desc>
  <style>
    :root {
      color-scheme: light dark;
      --card-ink: light-dark(#1a1a1a, #e8e3d5); /* --textPrimary */
      --card-muted: light-dark(#6f6f6f, #8a857a); /* --textSecondary */
      --card-trend-macro: light-dark(#d1d1d1, #56534d); /* --trendMacro */
      --card-trend-micro: light-dark(#a3a3a3, #777269); /* --trendMicro */
      --card-spot: light-dark(#c1432e, #d9644d); /* --spotColor */
    }

    :root[data-color-scheme="light"] {
      color-scheme: only light;
    }

    :root[data-color-scheme="dark"] {
      color-scheme: only dark;
    }

    #graphtv-card .gtv-wordmark {
      fill: var(--card-ink);
      font-family: Geist, Inter, 'Helvetica Neue', Arial, sans-serif;
      font-size: 236px;
      font-weight: 720;
      letter-spacing: -0.06em;
    }

    #graphtv-card .gtv-scroll {
      animation: gtv-scroll 10s linear infinite;
    }

    @keyframes gtv-scroll {
      to {
        transform: translateX(-9400px);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      #graphtv-card .gtv-scroll {
        animation: none;
      }
    }
  </style>
  <defs>
    <clipPath id="graphtv-card-frame">
      <rect width="1618" height="1000" />
    </clipPath>

    <!--
      One scroll period: Game of Thrones (2011), 73 rated of 73 episodes
      across 8 seasons, rated by TVmaze, TMDB and IMDb and plotted on IMDb.
      The period is wider than the 1618 viewBox, so the one selection can
      never appear twice in the card at once, and plotted marks stay above
      y=390 to clear the wordmark. Rebuild it, or rebuild it around another
      show, with scripts/build-card-svg.mjs.

      Referenced content is painted with presentation attributes: document CSS
      rules do not reach into a <use> shadow tree, but custom properties
      inherit into it.
    -->
    <g id="graphtv-card-period">
      <!-- Season axis: rail and season boundary ticks. -->
      <g>
        <line x1="0" y1="790" x2="9400" y2="790" stroke="var(--card-muted)" stroke-opacity="0.45" stroke-width="3.5" />
