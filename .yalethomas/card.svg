<svg
  xmlns="http://www.w3.org/2000/svg"
  id="graphtv-card"
  viewBox="0 0 1618 1000"
  role="img"
  aria-labelledby="graphtv-card-title graphtv-card-description"
>
  <title id="graphtv-card-title">graphtv</title>
  <desc id="graphtv-card-description">
    The graphtv wordmark over a scrolling episode-rating series: seasons in
    their own colors, marked off on an axis and carrying their own trendlines,
    hairlines where providers disagree, and one selected episode marked on the
    plot and the season axis.
  </desc>
  <style>
    :root {
      color-scheme: light dark;
      --card-ink: light-dark(#1a1814, #e8e3d5);
      --card-muted: light-dark(#6f6a5e, #8a857a);
      --card-trend-micro: light-dark(#a3a3a3, #777269);
      --card-spot: light-dark(#c1432e, #d9644d);
      /*
        The app's default maximin palette: the first four season colors it
        picks in each theme, greedily spread apart in OKLab.
      */
      --card-season-1: light-dark(oklch(52% 0.15 255), oklch(72% 0.15 240));
      --card-season-2: light-dark(oklch(62% 0.15 135), oklch(82% 0.15 75));
      --card-season-3: light-dark(oklch(62% 0.21 345), oklch(62% 0.21 345));
      --card-season-4: light-dark(oklch(42% 0.09 45), oklch(62% 0.15 135));
    }

    :root[data-color-scheme="light"] {
      color-scheme: only light;
    }

    :root[data-color-scheme="dark"] {
      color-scheme: only dark;
    }

    #graphtv-card .gtv-wordmark {
      fill: var(--card-ink);
      font-family: Geist, Inter, 'Helvetica Neue', Arial, sans-serif;
      font-size: 236px;
      font-weight: 720;
      letter-spacing: -0.06em;
    }

    #graphtv-card .gtv-scroll {
      animation: gtv-scroll 12s linear infinite;
    }

    @keyframes gtv-scroll {
      to {
        transform: translateX(-3200px);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      #graphtv-card .gtv-scroll {
        animation: none;
      }
    }
  </style>
  <defs>
    <clipPath id="graphtv-card-frame">
      <rect width="1618" height="1000" />
    </clipPath>

    <!--
      One scroll period, 3200 wide: four seasons of episodes on a 120 pitch,
      separated by a 200 season gap. The period is wider than the 1618 viewBox,
      so the single selected episode and its season can never appear twice in
      the card at once. Each season takes its own maximin color, as in the
      app's default palette. Marks stay above y=400 to clear the wordmark.
      Points sit at the sparse end of the app's mark scaling (large points
      over thin trendlines) and the selected episode grows by 1.5x.

      Referenced content is painted with presentation attributes: document CSS
      rules do not reach into a <use> shadow tree, but custom properties
      inherit into it.
    -->
    <g id="graphtv-card-period">
      <!-- Season axis: rail, season boundary ticks, and the selected season. -->
      <g stroke="var(--card-muted)" stroke-width="3">
        <line x1="0" y1="790" x2="3200" y2="790" stroke-opacity="0.45" />
        <line x1="700" y1="790" x2="700" y2="764" stroke-opacity="0.7" />
        <line x1="1620" y1="790" x2="1620" y2="764" stroke-opacity="0.7" />
        <line x1="2300" y1="790" x2="2300" y2="764" stroke-opacity="0.7" />
        <line x1="3100" y1="790" x2="3100" y2="764" stroke-opacity="0.7" />
      </g>
      <line
        x1="740"
        y1="790"
        x2="1580"
        y2="790"
        stroke="var(--card-spot)"
        stroke-width="6"
      />

      <g
        font-family="Geist, Inter, 'Helvetica Neue', Arial, sans-serif"
        font-size="52"
        font-weight="600"
        letter-spacing="0.06em"
        text-anchor="middle"
      >
        <text x="300" y="864" fill="var(--card-ink)" fill-opacity="0.72">S1</text>
        <text x="1160" y="864" fill="var(--card-spot)">S2</text>
        <text x="1960" y="864" fill="var(--card-ink)" fill-opacity="0.72">S3</text>
        <text x="2700" y="864" fill="var(--card-ink)" fill-opacity="0.72">S4</text>
      </g>

      <!-- Season trendlines, fitted to each season's own episodes. -->
      <g
        stroke="var(--card-trend-micro)"
        stroke-width="7"
        stroke-linecap="round"
      >
        <line x1="0" y1="328.1" x2="600" y2="259.2" />
        <line x1="800" y1="252.7" x2="1520" y2="135.2" />
        <line x1="1720" y1="207.4" x2="2200" y2="317" />
        <line x1="2400" y1="292.1" x2="3000" y2="141.8" />
      </g>

      <!-- Provider disagreement, drawn as a spread hairline through the point. -->
      <g
        stroke="var(--card-muted)"
        stroke-opacity="0.5"
        stroke-width="5"
        stroke-linecap="round"
      >
        <line x1="120" y1="248.3" x2="120" y2="324.3" />
        <line x1="480" y1="267.3" x2="480" y2="327.3" />
        <line x1="920" y1="152.7" x2="920" y2="244.7" />
        <line x1="1720" y1="153.7" x2="1720" y2="221.7" />
        <line x1="2080" y1="198.5" x2="2080" y2="286.5" />
        <line x1="2520" y1="203.5" x2="2520" y2="259.5" />
        <line x1="2880" y1="136.7" x2="2880" y2="216.7" />
      </g>

      <!-- The selected episode's spread is emphasized and capped, as in the app. -->
      <g stroke="var(--card-muted)" stroke-opacity="0.9" stroke-width="5">
        <line x1="1160" y1="113.8" x2="1160" y2="217.8" />
        <line x1="1132" y1="113.8" x2="1188" y2="113.8" />
        <line x1="1132" y1="217.8" x2="1188" y2="217.8" />
      </g>

      <!-- Episodes, one group per season in that season's palette color. -->
      <g fill="var(--card-season-1)">
        <circle cx="0" cy="330.2" r="24" />
        <circle cx="120" cy="286.3" r="24" />
        <circle cx="240" cy="341.2" r="24" />
        <circle cx="360" cy="264.4" r="24" />
        <circle cx="480" cy="297.3" r="24" />
        <circle cx="600" cy="242.5" r="24" />
      </g>
      <g fill="var(--card-season-2)">
        <circle cx="800" cy="264.4" r="24" />
        <circle cx="920" cy="198.7" r="24" />
        <circle cx="1040" cy="242.5" r="24" />
        <circle cx="1280" cy="209.6" r="24" />
        <circle cx="1400" cy="154.8" r="24" />
        <circle cx="1520" cy="121.9" r="24" />
      </g>
      <g fill="var(--card-season-3)">
        <circle cx="1720" cy="187.7" r="24" />
        <circle cx="1840" cy="253.5" r="24" />
        <circle cx="1960" cy="297.3" r="24" />
        <circle cx="2080" cy="242.5" r="24" />
        <circle cx="2200" cy="330.2" r="24" />
      </g>
      <g fill="var(--card-season-4)">
        <circle cx="2400" cy="297.3" r="24" />
        <circle cx="2520" cy="231.5" r="24" />
        <circle cx="2640" cy="264.4" r="24" />
        <circle cx="2760" cy="198.7" r="24" />
        <circle cx="2880" cy="176.7" r="24" />
        <circle cx="3000" cy="132.9" r="24" />
      </g>

      <!-- Exactly one selected episode per period, 1.5x its resting size. -->
      <circle cx="1160" cy="165.8" r="36" fill="var(--card-spot)" />
    </g>
  </defs>

  <g clip-path="url(#graphtv-card-frame)" aria-hidden="true">
    <g class="gtv-scroll">
      <use href="#graphtv-card-period" x="-3200" />
      <use href="#graphtv-card-period" />
      <use href="#graphtv-card-period" x="3200" />
    </g>
  </g>

  <text class="gtv-wordmark" x="809" y="585" text-anchor="middle">graphtv</text>
</svg>
