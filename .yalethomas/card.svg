<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1618 1000"
  role="img"
  aria-labelledby="graphtv-card-title graphtv-card-description"
>
  <title id="graphtv-card-title">graphtv</title>
  <desc id="graphtv-card-description">
    The graphtv wordmark over scrolling episode-rating dots, source-spread hairlines,
    and season trendlines.
  </desc>
  <style>
    .word {
      fill: #e8e3d5;
      font-family: Geist, Inter, 'Helvetica Neue', Arial, sans-serif;
      font-size: 318px;
      font-weight: 720;
      letter-spacing: -0.06em;
    }

    .season-trendline {
      stroke: #777269;
      stroke-width: 2;
    }

    .source-hairline {
      stroke: #8a857a;
      stroke-opacity: 0.42;
      stroke-width: 2;
    }

    .episode-point {
      fill: #e8e3d5;
    }

    .episode-point-active {
      fill: #c1432e;
    }

    .rolling-trend {
      animation: roll 10s linear infinite;
    }

    @keyframes roll {
      to {
        transform: translateX(-1370px);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .rolling-trend {
        animation: none;
      }
    }
  </style>
  <defs>
    <g id="trend-segment">
      <line class="season-trendline" x1="0" y1="510" x2="1370" y2="430" />
      <g class="source-hairlines">
        <line class="source-hairline" x1="112" y1="445" x2="112" y2="499" />
        <line class="source-hairline" x1="328" y1="351" x2="328" y2="416" />
        <line class="source-hairline" x1="550" y1="321" x2="550" y2="374" />
        <line class="source-hairline" x1="766" y1="432" x2="766" y2="493" />
        <line class="source-hairline" x1="988" y1="461" x2="988" y2="516" />
        <line class="source-hairline" x1="1208" y1="368" x2="1208" y2="433" />
      </g>
      <g class="episode-points">
        <circle class="episode-point" cx="0" cy="508" r="6" />
        <circle class="episode-point" cx="112" cy="472" r="6" />
        <circle class="episode-point" cx="220" cy="533" r="6" />
        <circle class="episode-point" cx="328" cy="382" r="6" />
        <circle class="episode-point" cx="442" cy="427" r="6" />
        <circle class="episode-point" cx="550" cy="346" r="6" />
        <circle class="episode-point-active" cx="660" cy="501" r="7" />
        <circle class="episode-point" cx="766" cy="462" r="6" />
        <circle class="episode-point" cx="878" cy="560" r="6" />
        <circle class="episode-point" cx="988" cy="486" r="6" />
        <circle class="episode-point" cx="1098" cy="526" r="6" />
        <circle class="episode-point" cx="1208" cy="399" r="6" />
        <circle class="episode-point" cx="1310" cy="438" r="6" />
      </g>
    </g>
  </defs>
  <g class="rolling-trend">
    <use href="#trend-segment" x="-1370" />
    <use href="#trend-segment" x="0" />
    <use href="#trend-segment" x="1370" />
    <use href="#trend-segment" x="2740" />
  </g>
  <text class="word" x="809" y="602" text-anchor="middle">graphtv</text>
</svg>
