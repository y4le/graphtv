        <line x1="9200" y1="790" x2="9200" y2="772.5" stroke="var(--card-muted)" stroke-opacity="0.7" stroke-width="3.5" />
      </g>

      <g font-family="'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size="42" text-anchor="middle">
        <text x="590" y="864" fill="var(--card-muted)">Season 1</text>
        <text x="1820" y="864" fill="var(--card-muted)">Season 2</text>
